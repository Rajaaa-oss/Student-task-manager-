

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px;
  font-family: Arial, sans-serif;
  background: #101116;
  color: #e5e7eb;
}

h1 {
  color: #b7a5ff;
  font-size: 36px;
}

.subtitle, .footer {
  color: #a5b4c9;
  font-size: 18px;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 30px;
  background: #202020;
  border-radius: 25px;
}

h2 {
  font-size: 28px;
}

input {
  padding: 14px;
  margin: 6px 0;
  border-radius: 12px;
  border: 1px solid #555;
  background: #292929;
  color: white;
  font-size: 16px;
  max-width: 100%;
}

#taskInput {
  width: 65%;
}

button {
  padding: 14px 18px;
  border: none;
  border-radius: 12px;
  background: #3020c9;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.delete {
  background: #c00000;
}

.task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 18px 0;
  border-bottom: 1px solid #555;
  flex-wrap: wrap;
}

.task-info {
  flex: 1;
  min-width: 150px;
  overflow-wrap: anywhere;
}

.task small {
  display: block;
  color: #a5b4c9;
  margin-top: 7px;
}

.done {
  text-decoration: line-through;
  color: #999;
}

.stats {
  display: flex;
  justify-content: space-between;
  color: #a5b4c9;
  margin: 20px 0;
}

.progress-bg {
  width: 100%;
  height: 14px;
  background: #444;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #a78bfa;
  transition: width 0.3s;
}

#percentage {
  color: #b7a5ff;
  font-weight: bold;
}

.footer {
  text-align: center;
  margin: 45px 0;
}

@media(max-width: 500px) {
  body {
    padding: 16px;
  }

  h1 {
    font-size: 29px;
  }

  .container {
    padding: 22px;
  }

  #taskInput {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>My Study Planner 📚</h1>
<p class="subtitle">Plan your day. Complete your goals.</p>

<div class="container">

<h2>My Tasks</h2>

<input type="text" id="taskInput"
placeholder="Enter a study task">

<input type="date" id="taskDate">

<button onclick="addTask()">Add Task +</button>

<div class="stats">
<span>Total: <span id="total">0</span></span>
<span>Completed: <span id="completed">0</span></span>
</div>

<h3>My Progress 📊</h3>

<div class="progress-bg">
<div id="progressBar"></div>
</div>

<p id="percentage">0% Completed</p>

<p id="message">Start completing your goals!</p>

<div id="taskList"></div>

</div>

<p class="footer">
Small steps lead to big achievements ✨
</p>

<script>

let tasks = JSON.parse(
  localStorage.getItem("studyTasks") || "[]"
);

function saveTasks() {
  localStorage.setItem(
    "studyTasks",
    JSON.stringify(tasks)
  );
}

function addTask() {
  let input = document.getElementById("taskInput");
  let date = document.getElementById("taskDate");

  let name = input.value.trim();

  if (name === "") {
    alert("Please enter a task!");
    return;
  }

  tasks.push({
    name: name,
    date: date.value,
    done: false
  });

  input.value = "";
  date.value = "";

  saveTasks();
  displayTasks();
}

function completeTask(index) {
  tasks[index].done = !tasks[index].done;
  saveTasks();
  displayTasks();
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  displayTasks();
}

function displayTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let completed = tasks.filter(
    task => task.done
  ).length;

  let total = tasks.length;

  let percentage = total === 0
    ? 0
    : Math.round((completed / total) * 100);

  document.getElementById("total").textContent = total;
  document.getElementById("completed").textContent = completed;

  document.getElementById("progressBar").style.width =
    percentage + "%";

  document.getElementById("percentage").textContent =
    percentage + "% Completed";

  document.getElementById("message").textContent =
    total > 0 && completed === total
      ? "Amazing! All tasks completed! 🎉"
      : "Keep going! You can do it 💪";

  tasks.forEach((task, index) => {
    let div = document.createElement("div");
    div.className = "task";

    let info = document.createElement("div");
    info.className = "task-info";

    let label = document.createElement("span");
    label.textContent = task.name;
    if (task.done) label.className = "done";

    let small = document.createElement("small");

    if (task.date) {
      small.textContent =
        "Deadline: " + task.date +
        (task.date < new Date().toLocaleDateString("en-CA")
          && !task.done ? " ⚠️ Overdue" : "");
    } else {
      small.textContent = "No deadline";
    }

    let checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.onchange = () => completeTask(index);

    let del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "delete";
    del.onclick = () => deleteTask(index);

    info.appendChild(label);
    info.appendChild(small);
    div.appendChild(checkbox);
    div.appendChild(info);
    div.appendChild(del);

    list.appendChild(div);
  });
}

displayTasks();

</script>
</body>
</html>
